# ---------------------------
# Despliegue con Helm
# ---------------------------
deploy:
  kubeContext: minikube # Contexto de Kubernetes para el entorno de desarrollo

  helm:
    releases:
      # Definimos un release para cada servicio utilizando Helm Charts
      - name: inventory-service
        chartPath: ./helm-charts/app
        createNamespace: true
        namespace: e-bambi
        valuesFiles:
          - ./values/dev/inventory-service.yaml

      - name: payment-service
        chartPath: ./helm-charts/app
        namespace: e-bambi
        valuesFiles:
          - ./values/dev/payment-service.yaml

