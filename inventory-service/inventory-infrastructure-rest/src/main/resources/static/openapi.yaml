openapi: 3.1.1
info:
  title: Swagger Inventory Service
  description: |-
    Bienvenido a la documentación oficial del microservicio 'Payment Service'. Aquí podrás explorar e interactuar con los 
    diversos recursos disponibles través de su API. 
    Esta documentación proporciona los detalles técnicos necesarios para utilizar las funcionalidades ofrecidas por el 
    servicio de manera eficiente.

    Algunos enlaces útiles:
      - [El repositorio de Inventory Service](https://github.com/ByLuisen/my-k8s-project/tree/main/apps/order-service)
      - [La definición de la API para Inventory Service](https://github.com/ByLuisen/my-k8s-project/blob/main/apps/order-service/src/main/resources/static/openapi.yaml)
  version: 1.0.12
servers:
  - url: /api
tags:
  - name: Suppliers
    description: Nuestros diferentes proveedores
  - name: Images
    description: Imagenes de nuestros productos
  - name: Products
    description: Explora nuesto catálogo de productos
  - name: Movement types
    description: Diferentes tipos de movimientos para la entrada o salida de stock
  - name: Offers
    description: Ofertas de nuestros productos
  - name: Inventory movements
    description: Movimientos de inventario
  - name: Departments
    description: Nuestros diferentes departamentos
  - name: Brands
    description: Marcas
  - name: Product statuses
    description: Obtén los estados en los que nuestros productos pueden estar
paths:
  /v1/suppliers/me:
