      tags:
        - Suppliers
      summary: Actualiza tus datos de proveedor
      description: Actualiza tus datos de proveedor
      operationId: updateSupplier
      requestBody:
        description: Datos necesarios para realizar la actualización
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierRequestDto'
        required: true
      responses:
        '200':
          description: Operación exitosa
          content:
            'applications/json':
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '401':
          description: No autenticado
        '403':
          description: El token de acceso no tiene los roles o permisos requeridos
        default:
          description: Error inesperado
      security:
        - BambiOAuth2: [supplier]
      x-roles-required:
        - SUPPLIER
    delete:
